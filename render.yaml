services:
  - type: web
    runtime: node
    name: cotton-candy-event-deco-api
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev && npm run build --workspace server
    startCommand: npm run start --workspace server
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLIENT_URLS
        sync: false
      - key: ADMIN_CLIENT_URL
        sync: false

  - type: web
    runtime: static
    name: cotton-candy-event-deco-site
    buildCommand: npm ci && npm run build --workspace client
    staticPublishPath: client/dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_API_URL
        sync: false

  - type: web
    runtime: static
    name: cotton-candy-event-deco-admin
    buildCommand: npm ci && npm run build --workspace client
    staticPublishPath: client/dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_API_URL
        sync: false
      - key: VITE_APP_MODE
        value: admin
